# Use a Windows x64 shell runner tagged "windows"; see docs/RELEASING.md.
# Never put the multi-gigabyte release directory in GitLab job artifacts.
stages:
  - checks
  - release

variables:
  GIT_DEPTH: '0'
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always

default:
  tags: [windows]
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      if ((node --version) -notmatch '^v24\.') { throw 'Install Node.js 24 x64 on this runner.' }
      if ($LASTEXITCODE -ne 0) { throw 'Node.js is unavailable.' }
      $rustInfo = rustc -vV | Out-String
      if ($LASTEXITCODE -ne 0 -or $rustInfo -notmatch 'host: x86_64-pc-windows-msvc') { throw 'Install stable Rust x64 MSVC on this runner.' }

checks:
  stage: checks
  script:
    - npm ci --no-audit
    - if ($LASTEXITCODE -ne 0) { throw 'npm ci --no-audit failed.' }
    - npm test
    - if ($LASTEXITCODE -ne 0) { throw 'npm test failed.' }
    - npm run build
    - if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
    - cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
    - if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed.' }

release:
  stage: release
  needs: [checks]
  # Serialize retries for a tag, including upload and release creation.
  resource_group: release-$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - npm ci --no-audit
    - if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
    # build-release prepares the pinned, isolated Inno Setup compiler.
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Variant all -Tag $env:CI_COMMIT_TAG
    - if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-release.ps1 -Provider gitlab -Tag $env:CI_COMMIT_TAG -Directory artifacts/release
    - if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/release/SHA256SUMS
      - artifacts/release/RELEASE-NOTES.md
      - artifacts/release/models.lock.json
