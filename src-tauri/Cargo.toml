[package]
name = "qwen-desk"
default-run = "qwen-desk"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Private local Qwen inference workstation"
license = "MIT"

[lib]
name = "qwen_desk"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:tauri-plugin-window-state"]
verification = []

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "0.8"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
url = "2"
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "qwen-desk"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "qwen-verify"
path = "src/bin/verify.rs"
required-features = ["verification"]
